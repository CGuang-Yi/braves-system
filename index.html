<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braves Company Data System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=136">
<!-- Third-party libs are VENDORED locally under vendor/ (pinned exact versions)
     rather than loaded from a CDN. This removes the supply-chain risk flagged by
     code scanning ("inclusion of functionality from an untrusted source" — a CDN
     can serve altered/compromised script with no integrity check), works offline
     under file://, and pins exact versions. To upgrade: replace the file in
     vendor/ with the new pinned build and bump its ?v below.
       • Chart.js 4.4.1 (UMD)   • PapaParse 5.4.1   • ExcelJS 4.4.0 -->
<script src="vendor/chart.umd.min.js?v=114"></script>
<script src="vendor/papaparse.min.js?v=114"></script>
<!-- ExcelJS: reads .xlsx cell fill colours (the admin Sick-History importer needs
     fills, which PapaParse/CSV can't carry). Loaded lazily-tolerant: the importer
     checks `typeof ExcelJS` and warns if it didn't load. -->
<script src="vendor/exceljs.min.js?v=114"></script>
</head>
<body>

<!-- LOGIN OVERLAY: covers the whole app until a valid session exists.
     Starts hidden; bootstrap() in main.js reveals it synchronously when there's
     no token, so an unauthenticated user never sees the app chrome. -->
<div id="login-overlay" class="login-overlay hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-brand">
      <small>40 SAR</small>
      <h1>Data System</h1>
    </div>
    <p class="login-sub">Sign in with your account</p>
    <label class="login-field">Email
      <input type="email" id="login-email" autocomplete="username" required placeholder="you@unit.mil">
    </label>
    <label class="login-field">Password
      <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
    </label>
    <div id="login-error" class="login-error"></div>
    <button type="submit" id="login-submit" class="btn btn-primary login-submit">Sign In</button>
  </form>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo">
    <small>40 SAR BRAVES</small>
    <h2>Data System</h2>
  </div>
  <button class="nav-btn active" data-nav="dashboard"><span>📊</span><span>Dashboard</span></button>
  <button class="nav-btn" data-nav="parade"><span>🎖️</span><span>Parade State</span></button>
  <button class="nav-btn" data-nav="medical"><span>🏥</span><span>Medical</span></button>
  <button class="nav-btn" data-nav="attendance"><span>📋</span><span>Conducts</span></button>
  <button class="nav-btn" data-nav="leave"><span>📅</span><span>Leave / Out</span></button>
  <button class="nav-btn" data-nav="duty"><span>🛡️</span><span>Duty List</span></button>
  <button class="nav-btn" data-nav="conductdash"><span>📈</span><span>Conduct Dash</span></button>
  <button class="nav-btn" data-nav="statusboard"><span>🗓️</span><span>Status Board</span></button>
  <button class="nav-btn" data-nav="ha"><span>🌡️</span><span>Heat Acclim.</span></button>
  <button class="nav-btn" data-nav="ippt"><span>🏃</span><span>IPPT</span></button>
  <button class="nav-btn" data-nav="soc"><span>🪖</span><span>SOC</span></button>
  <button class="nav-btn" data-nav="polar"><span>⌚</span><span>Polar Flow</span></button>
  <button class="nav-btn" data-nav="mskAnalytics"><span>📊</span><span>MSK Analytics</span></button>
  <button class="nav-btn admin-only" data-nav="conducts"><span>🏷️</span><span>Conduct ID</span></button>
  <button class="nav-btn" data-nav="detail"><span>🔎</span><span>Detail</span></button>
  <button class="nav-btn" data-nav="roster"><span>👥</span><span>Roster</span></button>
  <button class="nav-btn commander-plus" data-nav="archive"><span>🗄️</span><span>Archive</span></button>
  <button class="nav-btn" data-nav="sync"><span>⚙️</span><span>Settings</span></button>
  <div id="sidebar-footer">
    <div id="account-identity"></div>
    <div id="sync-indicator">● Not synced</div>
    <div id="str-counter"></div>
  </div>
</div>

<!-- Mobile backdrop: shown when sidebar is open on phone screens; tap to close. -->
<div id="sidebar-backdrop" class="hidden"></div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <button id="mobile-nav-toggle" aria-label="Open menu">☰</button>
    <!-- Always-visible sync pill. Mirrors the sidebar indicator so push/sync
         status (saved / saving / unsaved-retry) is obvious on mobile, where the
         sidebar is hidden behind ☰. Tappable to retry when there are unsaved
         changes (wired in sync.js updateSyncPill). -->
    <button id="sync-status" class="s-ok" title="Sync status">✓ Saved</button>
    <span class="topbar-search-icon">🔍</span>
    <input id="search-input" placeholder="Search 4D / name…">
    <div id="search-results" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <button id="mobile-filter-toggle" aria-label="Open scope filter">All</button>
    <div id="topbar-filters">
      <span class="filter-label">Scope</span>
      <div id="filter-role-group" class="filter-role-group" title="Show Commanders, Recruits, or both">
        <button data-role="" class="role-btn active">All</button>
        <button data-role="Commander" class="role-btn">Cmdrs</button>
        <button data-role="Recruit" class="role-btn">Recs</button>
      </div>
      <select id="filter-plt" class="topbar-select" title="Filter by platoon"></select>
      <select id="filter-sect" class="topbar-select" title="Filter by section"></select>
      <button id="filter-clear" class="btn btn-icon" title="Clear filter" style="display:none">✕</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- MODAL -->
<!--
  Backdrop-click closes; a click inside the modal must not. That guard lives in
  closeModalOnBackdrop() as a target-identity check, NOT as an
  onclick="event.stopPropagation()" on .modal — see the comment on that function
  in js/forms.js. Stopping the event here also stopped it reaching the single
  delegated listener in js/actions.js, which silently killed every data-action
  button rendered into a modal.
-->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!--
  Plain scripts (not modules) so this works under file:// too.
  Load order matters: state → api → ippt-scoring → calc → appointment-4d → helpers →
  sick-history-import → duty-points → duty-eligibility → duty-conflicts → duty-import →
  duty-schedule →
  render* → forms* → braves-parade → actions → parade-tab → render-duty →
  sync → main. The render-* and forms-* files are SPLITS of two former monoliths,
  not independent modules: they share the one global scope, and their tags must
  stay in the order below because that order reproduces the original files
  top-to-bottom (test/sources.js encodes the same order for the test suite). sick-history-import is a DOM-free pure parser (used by the admin
  xlsx importer in forms); load it before forms. parade-tab is the Parade State
  tab view; it calls bp* globals from braves-parade at runtime, so load it after
  braves-parade. actions is the delegated event dispatcher; any file calling
  registerActions() must load after it.
  duty-points/duty-eligibility/duty-conflicts/duty-import are DOM-free pure modules (the duty
  list's arithmetic, eligibility rules, conflict detection and workbook parser).
  Only duty-conflicts has a dependency — addDaysISO from calc.js — so all four
  load after calc and before the views that use them. render-duty is the Duty
  List tab view — it sits with parade-tab rather than the other render-* files
  because it calls registerActions(), so it must load after actions. forms-duty
  is the duty list's write half; like render-duty it is a NEW file rather than a
  split of the forms monolith, so it is NOT part of test/sources.js PARTS.forms.
  appointment-4d is a DOM-free leaf parser for the appointment codes commanders
  carry in the Roster fourD column (SC21/PS2/PC2). BOTH helpers (personPlatoon/
  personSection) and duty-eligibility (dutyAppointmentOf) call it, so it loads
  before both — it is a leaf precisely so neither of those has to depend on the
  other.
-->
<script src="js/state.js?v=137"></script>
<script src="js/api.js?v=131"></script>
<script src="js/ippt-scoring.js?v=113"></script>
<script src="js/calc.js?v=8"></script>
<script src="js/appointment-4d.js?v=1"></script>
<script src="js/helpers.js?v=150"></script>
<script src="js/sick-history-import.js?v=114"></script>
<script src="js/duty-points.js?v=1"></script>
<script src="js/duty-eligibility.js?v=4"></script>
<script src="js/duty-conflicts.js?v=1"></script>
<script src="js/duty-import.js?v=1"></script>
<script src="js/duty-schedule.js?v=3"></script>
<script src="js/render.js?v=179"></script>
<script src="js/render-dashboard.js?v=2"></script>
<script src="js/render-records.js?v=2"></script>
<script src="js/render-conducts.js?v=1"></script>
<script src="js/render-statusboard.js?v=2"></script>
<script src="js/forms.js?v=180"></script>
<script src="js/forms-import.js?v=1"></script>
<script src="js/forms-records.js?v=3"></script>
<script src="js/forms-reports.js?v=5"></script>
<script src="js/forms-conducts.js?v=2"></script>
<script src="js/forms-wizard.js?v=2"></script>
<script src="js/forms-admin.js?v=4"></script>
<script src="js/forms-duty.js?v=3"></script>
<script src="js/braves-parade.js?v=141"></script>
<script src="js/actions.js?v=1"></script>
<script src="js/parade-tab.js?v=28"></script>
<script src="js/render-duty.js?v=5"></script>
<script src="js/sync.js?v=130"></script>
<script src="js/main.js?v=125"></script>
</body>
</html>
